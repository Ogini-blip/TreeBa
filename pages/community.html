<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — TreeBa</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="../index.html" class="nav-logo">
      <img src="../images/TreeBa.png" alt="TreeBa Logo" class="nav-logo-img">
      TreeBa
    </a>

    <!-- MOBILE MENU BUTTON -->

    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="community.html" class="active">Community</a></li>
      <li><a href="teamfinder.html">Team Finder</a></li>
    </ul>

    <div class="nav-actions">
      <a href="login.html" class="btn-ghost">Log In</a>
      <a href="register.html" class="btn-primary">Sign Up</a>
    </div>
  </nav>

  <!-- CHAT SECTION -->
  <section class="section chat-section page-top">
    <div class="section-header">
      <h2>World Chat</h2>
      <p>Talk with the entire TreeBa community in real time</p>
    </div>

    <div class="chat-box">
      <div class="chat-header">
        <div class="chat-live-dot"></div>
        <span>World Chat</span>
        <small>Open to all players</small>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">
          <span>💬</span>
          <p>No messages yet. Be the first to say something!</p>
        </div>
      </div>

      <div class="chat-input-row">
        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Type a message... (sign up to chat)"
          maxlength="200"
        />
        <button class="chat-send-btn" id="chatSend">Send</button>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom">
      <span>© 2026 TreeBa. Not affiliated with Moonton.</span>
      <span>Built for the ML community</span>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
